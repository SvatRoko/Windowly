name: build
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/Windowly/Windowly.csproj -c Release
      - run: dotnet test tests/Windowly.Tests/Windowly.Tests.csproj -c Release
